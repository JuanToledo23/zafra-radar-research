# Site configuration (zafra.site). Morelos: Ingenio Emiliano Zapata supply area, zafra 2025-26.
# Everything here was hard-coded in scripts 00, 12-15 before exercise 5; paths are relative
# to the repo root.
name: morelos
description: Ingenio Emiliano Zapata supply area, Morelos, Mexico (training site)

aoi:
  bbox: [-99.35, 18.50, -99.05, 18.75]  # lon0, lat0, lon1, lat1 (= FIRMS bbox)
  epsg: 32614  # UTM 14N: S2 grid, buffers, areas

nisar:
  root: data/nisar  # new track/frames go to <root>/<product>_<direction>_t<N>f<N>/
  search: {start: "2025-11-15", end: "2026-05-21"}
  sources:
    gcov_asc: {product: GCOV, direction: ASCENDING, track: 19, frame: 11, dir: data/nisar}
    gcov_desc:
      {product: GCOV, direction: DESCENDING, track: 113, frame: 79,
       dir: data/nisar/GCOV_DESCENDING_t113f79}
    gunw_asc:
      {product: GUNW, direction: ASCENDING, track: 19, frame: 11,
       dir: data/nisar/GUNW_ASCENDING_t19f11}

zafra:
  name: "2025-26"
  start: "2025-11-01"  # season window, end exclusive
  end: "2026-06-01"
  crop_year_start: "2025-06-01"  # NDVI phenology: crop_year_start .. end
  scene_window: ["2025-12-01", "2026-02-01"]  # clearest full-canopy S2 scene, end exclusive
  baseline_months: [11, 12]  # radar baseline / pre-harvest level: cane standing everywhere
  check_windows:  # exercise-4e diagnostics in area_summary.json (both dated_dec1_20 ends included)
    dated_dec1_20: ["2025-12-01", "2025-12-21"]
    april: ["2026-04-01", "2026-05-01"]

firms:
  start: "2024-11-01"
  end: "2026-05-31"
  dir: data/firms

# gate B (optical), as in exercise 4c-4e; p_cane_radar alongside
gate_variant: optical

reference_fields: data/fields/fields_v2.geojson  # scores the segmentation (IoU)

paths:
  s2_dir: data/s2
  ndvi_stack: data/s2/s2_ndvi_stack_2025_26.tif
  temporal: data/s2/s2_temporal_2025_26.tif
  worldcover: data/s2/worldcover_2021.tif
  segments: data/fields/segments.geojson
  segmentation_results_dir: results/4d
  ts_cache: outputs/segments_ts
  timeseries: data/features/segments_timeseries.parquet
  coherence: data/features/segments_coherence.parquet
  cane_features: data/features/segments_cane_features.parquet
  harvest_geojson: data/results/harvest_dates_2025_26.geojson
  merged_geojson: data/results/harvest_dates_2025_26_merged.geojson
  slim_geojson: data/results/harvest_map_2025_26_slim.geojson
  results_dir: results/4e

# Exercise 6: alert rules (zafra.alerts) and per-field summaries (zafra.summary)
alerts:
  timezone: America/Mexico_City  # VIIRS times are UTC; the burn window is local time
  fire_buffer_m: 200  # as cane_features.FIRE_BUFFER_M: detections <= 200 m from the edge
  burn_window:
    # Tlaquiltenango municipal burn window (source given by the project author; the
    # document is to be cited in docs/METHODS.md). Other municipalities: same window
    # assumed until confirmed.
    default: ["09:00", "17:00"]
    default_confirmed: false
    municipalities:
      Tlaquiltenango: ["09:00", "17:00"]
  rules:
    FIRE_ACTIVE_OUTSIDE_HOURS: {enabled: true, severity: warning}
    BURN_WITHOUT_HARVEST: {enabled: true, severity: warning, days_after: 14}
    # off since the exercise-6 review: burning is the norm here but VIIRS misses most cane
    # burns (it fired on 91 % of dated harvests). Kept for completeness; the summary still
    # says when no VIIRS fire was detected.
    HARVEST_WITHOUT_FIRE: {enabled: false, severity: info, days_before: 7}
    HIGH_DATE_UNCERTAINTY: {enabled: true, severity: info, max_days: 9}
    RADAR_OPTICAL_DISAGREE: {enabled: true, severity: warning, max_other_p: 0.3}
    NO_BASELINE: {enabled: true, severity: info}

summary:
  model: claude-haiku-5-5  # current small model; only used when ANTHROPIC_API_KEY is set
  effort: low
  max_tokens: 1024
  max_words: 70  # verifier hard limit
  word_budget: 55  # what the prompt asks for
  price_usd_per_mtok: {input: 0.10, output: 0.50}  # Anthropic list price, Oct 2026

# Exercise 9: web map raster layers (zafra.rasters, scripts/18_web_rasters.py). Six
# ascending dates bracketing the harvest front (results/4e/weekly.csv: first harvests in
# mid-Dec, peak Jan, steady through Mar, last in early May). Ascending only: one geometry,
# so date-to-date changes are not viewing-angle changes.
web_rasters:
  source: gcov_asc
  dates: ["2025-11-23", "2025-12-29", "2026-01-22", "2026-02-15", "2026-03-11", "2026-04-28"]
  boxcar: 5  # pixels (10 m GCOV grid): ~50 m window
  zooms: [10, 14]
