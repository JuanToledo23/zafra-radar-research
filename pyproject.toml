[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zafra-radar"
version = "0.1.0"
description = "Per-field sugarcane harvest and burning detection from NISAR L-band SAR (NASA Space Apps 2026)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "h5py",
    "numpy",
    "pandas",
    "geopandas",
    "shapely",
    "rasterio",
    "pyproj",
    "matplotlib",
    "python-dotenv",
    "requests",
    "asf_search",
    "earthengine-api",
    "geemap",
    "tqdm",
    "scikit-learn",
    "xgboost",
    "joblib",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]
# Exercise 7 (automatic field segmentation, stretch goal). Not installed by `make setup`;
# install when starting that exercise: pip install -e ".[segmentation]"
segmentation = ["torch", "segment-anything"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
