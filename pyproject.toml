[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zafra-radar"
version = "0.1.0"
description = "Per-field sugarcane harvest and burning detection from NISAR L-band SAR (NASA Space Apps 2026)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "h5py",
    "numpy",
    "pandas",
    "geopandas",
    "shapely",
    "rasterio",
    "pyproj",
    "matplotlib",
    "python-dotenv",
    "requests",
    "asf_search",
    "earthengine-api",
    "geemap",
    "tqdm",
    "scikit-learn",
    "xgboost",
    "joblib",
    "scikit-image",
    "rasterstats",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]
# Exercise 4d, SAM variant only (the delivered classical segmentation needs none of this).
# Not installed by `make setup`: pip install -e ".[segmentation]". The ViT-B checkpoint
# (375 MB) is downloaded on first use into data/models/sam/ (git-ignored).
segmentation = ["torch", "segment-anything", "segment-geospatial"]
# Exercise 6, LLM field summaries only: without it (or without ANTHROPIC_API_KEY in .env)
# the summaries use the deterministic template. pip install -e ".[llm]"
llm = ["anthropic"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zafra = ["prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
markers = [
    "integration: needs docker; starts the product/ stack (skipped when docker is unavailable)",
]
